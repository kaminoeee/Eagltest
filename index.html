<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Eaglercraft Server Maker</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { background: #1e1e1e; padding: 25px; display: inline-block; border-radius: 10px; text-align: left; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, select { width: 100%; padding: 8px; margin: 8px 0 15px 0; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #2e7d32; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #388e3c; }
    </style>
</head>
<body>
    <h1>Eaglercraft サーバービルダー</h1>
    <div class="card">
        <label>サーバー名:</label>
        <input type="text" id="serverName" value="My Eaglercraft World">

        <label>キープインベントリ:</label>
        <select id="keepInventory">
            <option value="true">有効 (Keep Inventory ON)</option>
            <option value="false">無効 (OFF)</option>
        </select>

        <button onclick="deployServer()">サーバー設定を適用・起動</button>
    </div>

    <script>
        async function deployServer() {
            const serverName = document.getElementById('serverName').value;
            const keepInventory = document.getElementById('keepInventory').value;

            alert("設定を送信しました！サーバーを構築中...");

            const res = await fetch('/api/create-server', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ serverName, keepInventory })
            });

            const data = await res.json();
            if(data.success) {
                alert("GitHub Actionsが起動しました！接続準備が整うまで少しお待ちください。");
            } else {
                alert("エラーが発生しました: " + data.error);
            }
        }
    </script>
</body>
</html>
